<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>청렴·안전 신고 안내</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 휴대전화 한 손 조작 기준. 질문 2개(누구·무슨 일) → 상황별 안내 카드 → 펼침 상세 */
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --sunk:#EAEFED; --ink:#13241F; --muted:#56675F; --line:#D2DCD7;
  --accent:#145C4A; --accent-ink:#FFFFFF; --accent-soft:#E1EFEA;
  --warn:#94590A; --warn-soft:#FBF0DC; --bad:#A8322A; --bad-soft:#FAE5E2; --ok:#1F6E3E; --ok-soft:#E3F1E8;
  --font:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1714; --surface:#16211D; --sunk:#1C2A25; --ink:#E3ECE8; --muted:#97A9A1; --line:#2C3C36;
  --accent:#6CC3A8; --accent-ink:#0A201A; --accent-soft:#17342B;
  --warn:#E3A954; --warn-soft:#382A12; --bad:#F08A80; --bad-soft:#3C1C19; --ok:#6ACB8E; --ok-soft:#163222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1714; --surface:#16211D; --sunk:#1C2A25; --ink:#E3ECE8; --muted:#97A9A1; --line:#2C3C36;
  --accent:#6CC3A8; --accent-ink:#0A201A; --accent-soft:#17342B;
  --warn:#E3A954; --warn-soft:#382A12; --bad:#F08A80; --bad-soft:#3C1C19; --ok:#6ACB8E; --ok-soft:#163222; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.86rem}

header.top{background:var(--accent);color:var(--accent-ink);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:22px max(16px,env(safe-area-inset-left,0px)) 24px}
header.top .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
header.top .org{font-size:.85rem;opacity:.85;font-weight:500}
header.top h1{font-size:1.65rem;font-weight:700;letter-spacing:-.01em}
header.top p{font-size:.95rem;opacity:.92}

.draft{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:10px 14px;font-size:.88rem}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:1rem;padding:13px 14px 13px 42px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.search input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}

.q{display:flex;flex-direction:column;gap:10px}
.q h2{font-size:1.15rem;font-weight:700}
.q .step{font-size:.8rem;color:var(--accent);font-weight:700;letter-spacing:.04em}
.who{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.who button{font:inherit;font-weight:600;padding:12px 6px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.who button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.cats{grid-template-columns:minmax(0,1fr)}}
.cat{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;text-align:left;font:inherit;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
.cat:hover{border-color:var(--accent)}
.cat:focus-visible,.who button:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cat .ic{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center}
.cat .ic svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat b{display:block;font-size:1.02rem}
.cat span{display:block;font-size:.86rem;color:var(--muted);margin-top:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:1.1rem}
.chan{display:flex;flex-direction:column;gap:8px}
.chan .row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;font-size:.95rem;align-items:baseline}
.chan .row dt{color:var(--muted);font-size:.86rem}
.chan .row dd{margin:0;min-width:0;overflow-wrap:anywhere}
.todo{display:inline-block;background:var(--warn-soft);color:var(--warn);border:1px dashed var(--warn);border-radius:6px;padding:0 6px;font-size:.85rem;font-weight:600}
.tel{font-weight:700;font-size:1.05rem;letter-spacing:.02em}

/* 상세 */
.back{align-self:flex-start;font:inherit;font-weight:600;border:0;background:none;color:var(--accent);padding:6px 0;cursor:pointer}
.dhead{display:flex;flex-direction:column;gap:6px}
.dhead h1{font-size:1.45rem}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.78rem;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--sunk);color:var(--muted)}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details+details{margin-top:0}
summary{cursor:pointer;list-style:none;padding:14px 16px;font-weight:700;font-size:1.02rem;display:flex;justify-content:space-between;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:none;margin-right:4px}
details[open] summary::after{transform:rotate(-135deg)}
details .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;font-size:.96rem}
details ul,details ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.card h3{font-size:1rem}
.card .k{font-size:.78rem;font-weight:700;color:var(--accent);letter-spacing:.03em}
.quote{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.92rem}
.quote cite{display:block;font-style:normal;font-size:.8rem;color:var(--muted);margin-top:4px}
.caution{background:var(--bad-soft);border:1px solid var(--bad);border-radius:8px;padding:10px 12px;font-size:.92rem}
.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:600;padding:10px 14px;border-radius:8px;background:var(--accent);color:var(--accent-ink);text-decoration:none;border:0;cursor:pointer}
.btn.line{background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
#homeBody{display:flex;flex-direction:column;gap:22px}
.hits{display:flex;flex-direction:column;gap:8px}
.hit{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.hit b{display:block}
.hit span{font-size:.86rem;color:var(--muted)}
mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 2px}
/* 바로 신고하기 */
.act{background:var(--surface);border:2px solid var(--accent);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.act h2{font-size:1.15rem}
.actbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.actbtns{grid-template-columns:minmax(0,1fr)}}
.actbtns a,.actbtns button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font:inherit;padding:12px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);text-decoration:none;cursor:pointer}
.actbtns .sec{background:var(--surface);color:var(--accent)}
.actbtns b{font-size:1rem}
.actbtns span{font-size:.8rem;opacity:.9}
.compose{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.compose label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:600;color:var(--muted)}
.compose input,.compose textarea,.compose select{font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.compose textarea{min-height:110px;resize:vertical}
.compose .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.compose .two{grid-template-columns:minmax(0,1fr)}}
.compose input:focus-visible,.compose textarea:focus-visible,.compose select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.compose .hint{font-weight:400;font-size:.8rem}
.privacy{font-size:.84rem;background:var(--sunk);border-radius:8px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;max-width:calc(100% - 32px);z-index:20}
textarea.out{font-size:.85rem;min-height:160px}
footer{font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:no-preference){.cat,.who button{transition:border-color .15s,background .15s}}
</style>
</head>

 {id:'gift',icon:'gift',kw:'뇌물 선물 접대 청탁금지법 김영란법',title:'금품·향응, 부정청탁',who:['staff','citizen','vendor'],

  var h='';
  if(missing())h+='<p class="draft"><b>시안</b> · 공단 내부 신고 창구 정보가 확정되지 않았습니다. "확인 필요" 표시 항목을 채운 뒤 게시하세요.</p>';
  h+='<label class="search" for="q"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="예: 금품, 괴롭힘, 시설 파손, 익명" value="'+esc(state.q)+'" aria-label="안내 검색"></label>';
  h+='<div id="hits" class="hits"></div><div id="homeBody">';
  h+='<section class="q"><span class="step">질문 1</span><h2>누구신가요?</h2><div class="who" role="group" aria-label="신고자 구분">'+['staff','citizen','vendor'].map(function(w){return '<button type="button" data-who="'+w+'" aria-pressed="'+(state.who===w)+'">'+WHO[w]+'</button>'}).join('')+'</div></section>';
  h+='<section class="q"><span class="step">질문 2</span><h2>어떤 일을 알리려고 하시나요?</h2><div class="cats">'+list.map(function(c){return '<a class="cat" href="#c-'+c.id+'"><span class="ic"><svg viewBox="0 0 24 24">'+ICONS[c.icon]+'</svg></span><span><b>'+esc(c.title)+'</b><span>'+esc(c.summary)+'</span></span></a>'}).join('')+'</div>'+
     (state.who!=='all'&&state.who!=='staff'?'<p class="small muted">공단 직원의 폭언, 차별, 부당한 대우는 "갑질·괴롭힘·인권침해"에서 안내합니다.</p>':'')+'</section>';
  cur=null;h+='<section class="panel"><h2>공단 신고 창구</h2>'+orgBlock('org',['absurd','gapjil','sexual','human','subcon'])+chanHtml('orgSafety')+'<p class="small muted">시설 이용 불편과 건의는 <a href="'+BOARDS.voice.url+'" target="_blank" rel="noopener">고객의소리</a>를 이용하세요.</p></section>';
  h+='<section class="q"><h2>자주 묻는 질문</h2>'+FAQ.map(function(f){return '<details><summary>'+esc(f.q)+'</summary><div class="body">'+f.a()+'</div></details>'}).join('')+'</section>';
  h+='</div>'+foot();
  $('app').innerHTML=h;
  $('q').addEventListener('input',function(){state.q=this.value;renderHits()});
  document.querySelectorAll('[data-who]').forEach(function(b){b.onclick=function(){state.who=state.who===b.dataset.who?'all':b.dataset.who;try{localStorage.setItem('irg-who',state.who)}catch(e){}renderHome()}});
  renderHits();
}
function plain(c){return [c.kw||'',c.title,c.summary,(c.examples||[]).join(' '),(c.prepare||[]).join(' '),c.protect||'',c.caution||'',c.anonymousNote||'',(c.steps||[]).join(' '),(c.staffSteps||[]).join(' '),c.laws.map(function(l){return l.n+' '+l.t}).join(' ')].join(' ')}
function renderHits(){
  var q=state.q.trim(),box=$('hits'),body=$('homeBody');
  if(!q){box.innerHTML='';body.hidden=false;return}
  body.hidden=true;
  var words=q.split(/\s+/).filter(Boolean),res=[];
  CATS.forEach(function(c){var t=plain(c);if(words.every(function(w){return t.indexOf(w)>=0}))res.push({href:'#c-'+c.id,title:c.title,sub:snip(t,words[0])})});
  FAQ.forEach(function(f,i){var t=f.q+' '+f.a().replace(/<[^>]+>/g,'');if(words.every(function(w){return t.indexOf(w)>=0}))res.push({href:'#faq',title:f.q,sub:'자주 묻는 질문',faq:i})});
  box.innerHTML=res.length?res.map(function(r){return '<a class="hit" href="'+r.href+'"'+(r.faq!=null?' data-faq="'+r.faq+'"':'')+'><b>'+hl(r.title,words)+'</b><span>'+hl(r.sub,words)+'</span></a>'}).join(''):'<p class="muted">"'+esc(q)+'"에 맞는 안내가 없습니다. 다른 낱말로 찾거나 공단 신고 창구로 문의하세요.</p>';
  box.querySelectorAll('[data-faq]').forEach(function(a){a.onclick=function(ev){ev.preventDefault();state.q='';renderHome();var d=document.querySelectorAll('details')[+a.dataset.faq];if(d){d.open=true;d.scrollIntoView({block:'center'})}}});
}
function snip(t,w){var i=t.indexOf(w);if(i<0)return t.slice(0,60);var s=Math.max(0,i-20);return (s?'… ':'')+t.slice(s,s+70)+' …'}
function hl(s,words){var out=esc(s);words.forEach(function(w){var ew=esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');out=out.replace(new RegExp(ew,'g'),'<mark>$&</mark>')});return out}

function reportBox(c){
  var safe=c.id==='safety',tel=safe?ORG.safetyTel:ORG.tel,keys=c.boards||['absurd'],b=BOARDS[keys[0]];
  var boardBtn=b.url?'<a href="'+b.url+'" target="_blank" rel="noopener"><b>홈페이지로 신고</b><span>'+esc(b.label)+' 게시판 → 글쓰기</span></a>'
    :'<a href="'+HOME+'" target="_blank" rel="noopener"><b>홈페이지로 신고</b><span>'+esc(b.path)+' > '+esc(b.label)+'</span></a>';
  return '<section class="act" aria-labelledby="actT"><h2 id="actT">바로 신고하기</h2>'+
   '<div class="actbtns">'+boardBtn+
   '<a class="sec" href="tel:'+tel+'"><b>전화로 신고</b><span>'+esc(tel)+(safe?' (재난안전·산업안전보건)':' (안전감사팀)')+'</span></a>'+
   '<button type="button" class="sec" id="openCompose" aria-expanded="false"><b>신고서 작성</b><span>이메일 보내기 또는 게시판 붙여넣기</span></button></div>'+
   '<form class="compose" id="compose" hidden autocomplete="off">'+
   '<p class="privacy">이 페이지는 입력한 내용을 저장하거나 서버로 보내지 않습니다. <b>이메일로 보내기</b>를 누르면 휴대전화의 이메일 앱이 열리고, 보내기는 직접 누릅니다. 사진·파일은 이메일 앱에서 첨부하세요.</p>'+
   '<label>신고 유형<input id="f_type" value="'+esc(c.title)+'" readonly></label>'+
   '<div class="two"><label>언제<input id="f_when" placeholder="예: 2026.11.10. 오후 3시경"></label><label>어디서<input id="f_where" placeholder="예: 실내수영장 사무실"></label></div>'+
   '<label>누가 (신고 대상)<input id="f_who" placeholder="부서·직위·이름 등 아는 만큼"></label>'+
   '<label>무엇을, 어떻게<textarea id="f_what" placeholder="있었던 일을 순서대로 적어 주세요"></textarea></label>'+
   '<label>확인할 수 있는 자료<input id="f_proof" placeholder="예: 문자 메시지 캡처, 녹음, 목격자"><span class="hint">자료 자체는 이메일에 첨부하거나 게시판에 올리세요.</span></label>'+
   '<div class="two"><label>신고자 이름<input id="f_name"></label><label>연락처<input id="f_tel" inputmode="tel"></label></div>'+
   (c.id==='gift'||c.id==='conflict'?'<p class="hint small muted">청탁금지법·이해충돌방지법에 따른 신고는 신고자 인적사항을 적은 서명 문서가 필요합니다(각 법 제13조제3항, 제18조제3항).</p>':'<p class="hint small muted">이름과 연락처를 적으면 사실 확인과 결과 안내가 쉬워집니다.</p>')+
   '<label>결과 안내<select id="f_reply"><option>결과 안내를 원합니다</option><option>결과 안내를 원하지 않습니다</option></select></label>'+
   '<div class="btns"><button type="button" class="btn" id="sendMail">이메일로 보내기</button><button type="button" class="btn line" id="copyText">내용 복사 (게시판용)</button><button type="button" class="btn line" id="clearForm">지우기</button></div>'+
   '<textarea class="out" id="outText" hidden readonly aria-label="복사할 신고 내용"></textarea>'+
   '<p class="small muted">이메일 받는 곳: '+esc(ORG.email)+' · 이메일 앱이 열리지 않으면 "내용 복사" 후 위 주소로 보내거나 홈페이지 게시판에 붙여넣으세요.</p>'+
   '</form></section>';
}
function composeText(){
  var g=function(id){return ($(id).value||'').trim()||'-'};
  return '[신고 유형] '+g('f_type')+'\n[언제] '+g('f_when')+'\n[어디서] '+g('f_where')+'\n[누가] '+g('f_who')+'\n[내용]\n'+g('f_what')+'\n[확인 자료] '+g('f_proof')+'\n[신고자] '+g('f_name')+' / '+g('f_tel')+'\n[결과 안내] '+$('f_reply').value+'\n\n(청렴·안전 신고 안내 페이지에서 작성)';
}
function bindCompose(c){
  var f=$('compose'),o=$('openCompose');
  o.onclick=function(){f.hidden=!f.hidden;o.setAttribute('aria-expanded',String(!f.hidden));if(!f.hidden)$('f_when').focus()};
  f.addEventListener('submit',function(e){e.preventDefault()});
  function ok(){if(!$('f_what').value.trim()){toast('"무엇을, 어떻게"를 적어 주세요');$('f_what').focus();return false}return true}
  $('sendMail').onclick=function(){if(!ok())return;var sub='[신고] '+c.title+(($('f_where').value||'').trim()?' - '+$('f_where').value.trim():'');
    location.href='mailto:'+ORG.email+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(composeText());toast('이메일 앱을 여는 중입니다. 내용을 확인한 뒤 보내기를 누르세요')};
  $('copyText').onclick=function(){if(!ok())return;var t=composeText(),ta=$('outText');ta.value=t;ta.hidden=false;
    var fb=function(){ta.focus();ta.select();toast('선택된 내용을 길게 눌러 복사하세요')};
    try{navigator.clipboard.writeText(t).then(function(){toast('복사했습니다. 게시판 글쓰기에 붙여넣으세요')},fb)}catch(e){fb()}};
  $('clearForm').onclick=function(){f.reset();$('f_type').value=c.title;$('outText').hidden=true;$('outText').value='';toast('입력 내용을 지웠습니다')};
}
function toast(m){var t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3200)}
function sec(title,inner,open){return '<details'+(open?' open':'')+'><summary>'+title+'</summary><div class="body">'+inner+'</div></details>'}
function basis(b){return b?'<p class="small muted">근거: '+esc(b)+'</p>':''}
function renderDetail(c){
  cur=c;
  var h='<button type="button" class="back" id="back">← 처음으로</button>';
  h+='<div class="dhead"><h1>'+esc(c.title)+'</h1><p>'+esc(c.summary)+'</p><div class="tagrow">'+c.who.map(function(w){return '<span class="tag">'+WHO[w]+'</span>'}).join('')+'</div></div>';
  if(c.urgent)h+='<p class="caution"><b>'+esc(c.urgent)+'</b></p>';
  if(missing())h+='<p class="draft"><b>시안</b> · 공단 내부 창구 정보 확인 전입니다.</p>';
  h+=reportBox(c);
  h+=sec('이런 경우입니다','<ul>'+c.examples.map(function(e){return '<li>'+esc(e)+'</li>'}).join('')+'</ul>'+basis(c.examplesBasis)+(c.scope?'<p class="small">'+esc(c.scope)+'</p>':''),true);
  h+=sec('신고하는 곳',c.channels.map(chanHtml).join('')+(c.also?'<p class="small">'+esc(c.also)+'</p>':''),true);
  var st='';
  if(c.steps)st+='<p><b>공단 처리 절차</b></p><ol>'+c.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>'+basis(c.stepsBasis);
  if(c.staffSteps)st+='<p><b>공단 직원(근로자)이 신고한 경우 법정 절차</b></p><ol>'+c.staffSteps.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol>'+basis(c.staffStepsBasis);
  if(st)h+=sec('신고 후 처리 절차',st,false);
  h+=sec('신고할 때 준비할 것','<ul>'+c.prepare.map(function(e){return '<li>'+esc(e)+'</li>'}).join('')+'</ul>'+basis(c.prepareBasis)+(c.anonymousNote?'<p><b>신원 보호가 필요하면</b> '+esc(c.anonymousNote)+'</p>'+basis(c.anonymousBasis):''),false);
  h+=sec('신고자 보호','<p>'+esc(c.protect)+'</p>'+basis(c.protectBasis),false);
  if(c.caution)h+=sec('주의할 점','<p class="caution">'+esc(c.caution)+'</p>'+basis(c.cautionBasis),false);
  h+=sec('근거 법령',c.laws.map(function(l){return '<div class="quote">'+esc(l.t)+'<cite>「'+esc(l.n)+'」 '+esc(l.jo)+' · <a href="'+law(l.n,l.jo)+'" target="_blank" rel="noopener">법제처 원문 보기</a></cite></div>'}).join(''),false);
  h+=foot();
  $('app').innerHTML=h;
  $('back').onclick=function(){location.hash='home'};
  bindCompose(c);
  window.scrollTo(0,0);
}
function foot(){return '<footer><p>관리 부서: '+esc(ORG.name)+' '+esc(ORG.dept)+' · 안내 확인일 '+esc(ORG.updated.replace(/-/g,'.'))+'.</p><p>공단 신고 창구는 공단 홈페이지(2026.11.18. 확인), 법령 조문은 국가법령정보 현행본(2026.11.18. 조회) 기준입니다. 법령 개정이나 기관 연락처 변경 시 해당 기관 안내가 우선합니다.</p></footer>'}
function route(){
  var h=(location.hash||'').slice(1);
  if(h.indexOf('c-')===0){var c=CATS.filter(function(x){return 'c-'+x.id===h})[0];if(c){renderDetail(c);return}}
  renderHome();
}
$('orgName').textContent=ORG.name;
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
